name: Build PilotMonitoring EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Baixar modelo Faster-Whisper (base.en)
        run: |
          python -c "from faster_whisper import download_model; download_model('base.en', output_dir='whisper-model')"

      - name: Gerar Executável Standalone (Sem Console)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "PilotMonitoring" --collect-all SimConnect --collect-all faster_whisper --add-data "whisper-model;whisper-model" --add-data "audio;audio" app.py

      - name: Upload do Artefato (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: PilotMonitoring-Windows
          path: dist/PilotMonitoring.exe